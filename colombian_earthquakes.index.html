<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sismos Históricos de Colombia | Timeline</title>
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    
    <style>
        :root {
            --md-sys-color-primary: #8b0000;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #ffdad6;
            --md-sys-color-on-primary-container: #410002;
            --md-sys-color-surface: #fdf8f8;
            --md-sys-color-on-surface: #1c1b1f;
            --md-sys-color-surface-variant: #f4dddd;
            --md-sys-color-on-surface-variant: #534343;
            --md-sys-color-outline: #857373;
            --md-sys-color-bg: #fffbfb;
            
            --severity-extreme: #b71c1c;
            --severity-high: #e65100;
            --severity-moderate: #f57f17;
            --severity-low: #2e7d32;

            --radius-s: 8px;
            --radius-m: 16px;
            --radius-l: 28px;
            --shadow-1: 0px 1px 3px rgba(0,0,0,0.12), 0px 1px 2px rgba(0,0,0,0.24);
            --shadow-2: 0px 4px 8px rgba(0,0,0,0.12), 0px 2px 4px rgba(0,0,0,0.16);
            --shadow-3: 0px 8px 16px rgba(0,0,0,0.14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--md-sys-color-bg);
            color: var(--md-sys-color-on-surface);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--md-sys-color-surface);
            border-bottom: 1px solid var(--md-sys-color-surface-variant);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1300;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-1);
        }

        .header-title-box h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--md-sys-color-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-title-box p {
            font-size: 0.85rem;
            color: var(--md-sys-color-outline);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .menu-btn,
        .drawer-header,
        .drawer-scrim,
        .timeline-scroll-hint {
            display: none;
        }

        .menu-btn,
        .drawer-close {
            border: none;
            background: transparent;
            color: var(--md-sys-color-primary);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .menu-btn:hover,
        .drawer-close:hover {
            background: var(--md-sys-color-primary-container);
        }

        .drawer-close {
            display: inline-flex;
        }

        .lang-selector {
            display: flex;
            background: var(--md-sys-color-surface-variant);
            border-radius: 20px;
            padding: 3px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            padding: 6px 14px;
            border-radius: 16px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--md-sys-color-on-surface-variant);
        }

        .lang-btn.active {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            box-shadow: var(--shadow-1);
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            padding: 8px 12px 8px 36px;
            border-radius: 20px;
            border: 1px solid var(--md-sys-color-outline);
            outline: none;
            font-size: 0.85rem;
            background: var(--md-sys-color-surface);
        }

        .search-box .material-symbols-outlined {
            position: absolute;
            left: 10px;
            font-size: 1.1rem;
            color: var(--md-sys-color-outline);
        }

        .app-container {
            display: flex;
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }

        /* Timeline Navigation Sidebar */
        .timeline-sidebar {
            width: 320px;
            border-right: 1px solid var(--md-sys-color-surface-variant);
            padding: 1.5rem 1rem;
            position: sticky;
            top: 73px;
            height: calc(100vh - 73px);
            overflow-y: auto;
            background: var(--md-sys-color-surface);
        }

        .timeline-sidebar-inner {
            position: relative;
        }

        .timeline-tree {
            position: relative;
            padding-left: 28px;
        }

        .timeline-tree::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 10px;
            bottom: 10px;
            width: 3px;
            background: var(--md-sys-color-surface-variant);
            border-radius: 2px;
        }

        .timeline-node {
            position: relative;
            margin-bottom: 1.2rem;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: var(--radius-m);
            transition: all 0.2s ease;
        }

        .timeline-node:hover {
            background: var(--md-sys-color-primary-container);
        }

        .timeline-node.active {
            background: var(--md-sys-color-primary-container);
            border-left: 4px solid var(--md-sys-color-primary);
        }

        .timeline-node::before {
            content: '';
            position: absolute;
            left: -22px;
            top: 16px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--md-sys-color-outline);
            border: 2px solid var(--md-sys-color-surface);
            transition: all 0.2s ease;
        }

        .timeline-node.active::before {
            background: var(--md-sys-color-primary);
            transform: scale(1.3);
        }

        .node-year {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--md-sys-color-primary);
        }

        .node-title {
            font-size: 0.85rem;
            color: var(--md-sys-color-on-surface);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .node-mag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            color: #fff;
            margin-top: 4px;
        }

        /* Detail Display Main Area */
        .content-area {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .event-card {
            background: var(--md-sys-color-surface);
            border-radius: var(--radius-l);
            padding: 2rem;
            box-shadow: var(--shadow-2);
            border: 1px solid var(--md-sys-color-surface-variant);
            margin-bottom: 2rem;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--md-sys-color-surface-variant);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .card-header-main h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
            margin-bottom: 0.2rem;
        }

        .card-header-main .subtitle {
            font-size: 0.95rem;
            color: var(--md-sys-color-outline);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .mag-badge {
            padding: 0.5rem 1rem;
            border-radius: var(--radius-m);
            color: #fff;
            font-weight: 700;
            font-size: 1.3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: var(--shadow-1);
        }

        .mag-badge span {
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 400;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--md-sys-color-bg);
            border-radius: var(--radius-m);
            padding: 1rem;
            border: 1px solid var(--md-sys-color-surface-variant);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .stat-icon {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-primary);
            padding: 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-info .label {
            font-size: 0.75rem;
            color: var(--md-sys-color-outline);
            text-transform: uppercase;
            font-weight: 500;
        }

        .stat-info .value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
        }

        .event-map-shell {
            margin-bottom: 1.5rem;
            border: 1px solid var(--md-sys-color-surface-variant);
            border-radius: var(--radius-l);
            overflow: hidden;
            background: var(--md-sys-color-bg);
        }

        .event-map {
            width: 100%;
            height: 340px;
        }

        .event-map-shell .leaflet-container {
            background: #eef3f6;
        }

        .event-map-shell .leaflet-control-attribution {
            background: rgba(255, 255, 255, 0.84);
            backdrop-filter: blur(6px);
            font-size: 0.7rem;
        }

        .event-star-marker {
            color: var(--severity-extreme);
            font-size: 1.5rem;
            line-height: 1;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
            transform: translate(-50%, -50%);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--md-sys-color-primary);
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .description-box {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--md-sys-color-on-surface);
            background: var(--md-sys-color-bg);
            padding: 1.2rem;
            border-radius: var(--radius-m);
            border-left: 4px solid var(--md-sys-color-primary);
        }

        .tag-container {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .tag {
            background: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface-variant);
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        .mini-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .mini-card {
            background: var(--md-sys-color-bg);
            border: 1px solid var(--md-sys-color-surface-variant);
            border-radius: var(--radius-m);
            padding: 1rem;
        }

        .mini-card h3 {
            font-size: 1rem;
            color: var(--md-sys-color-primary);
            margin-bottom: 0.5rem;
        }

        .mini-card p,
        .mini-card li,
        .timeline-table td,
        .timeline-table th,
        .source-list li {
            font-size: 0.95rem;
            line-height: 1.55;
        }

        .bullet-list {
            margin: 0.75rem 0 0 1.1rem;
        }

        .bullet-list li + li {
            margin-top: 0.45rem;
        }

        .timeline-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            overflow: hidden;
            border-radius: var(--radius-m);
            border: 1px solid var(--md-sys-color-surface-variant);
        }

        .timeline-table th,
        .timeline-table td {
            padding: 0.85rem;
            text-align: left;
            vertical-align: top;
            border-bottom: 1px solid var(--md-sys-color-surface-variant);
        }

        .timeline-table th {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            font-weight: 700;
        }

        .timeline-table tr:last-child td {
            border-bottom: none;
        }

        .source-list {
            margin: 0.9rem 0 0 1.2rem;
        }

        .source-list li + li {
            margin-top: 0.65rem;
        }

        a.source-link {
            color: var(--md-sys-color-primary);
            text-decoration: none;
            font-weight: 500;
        }

        a.source-link:hover {
            text-decoration: underline;
        }

        .source-note {
            margin-top: 0.9rem;
            color: var(--md-sys-color-outline);
            font-size: 0.9rem;
        }

        .section-stack > * + * {
            margin-top: 1rem;
        }

        @media (max-width: 900px) {
            body.drawer-open {
                overflow: hidden;
            }

            header {
                padding: 0.8rem 1rem;
                display: grid;
                grid-template-columns: auto 1fr;
                align-items: center;
                gap: 0.8rem;
            }

            .menu-btn {
                display: inline-flex;
            }

            .header-title-box {
                min-width: 0;
            }

            .header-title-box h1 {
                font-size: 1.05rem;
                line-height: 1.2;
                gap: 0.4rem;
            }

            .header-title-box p {
                display: none;
            }

            .controls {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                z-index: 1220;
                width: min(82vw, 320px);
                padding: 1rem;
                background: var(--md-sys-color-surface);
                box-shadow: var(--shadow-3);
                transform: translateX(100%);
                transition: transform 0.25s ease;
                flex-direction: column;
                align-items: stretch;
                justify-content: flex-start;
                gap: 1rem;
            }

            body.drawer-open .controls {
                transform: translateX(0);
            }

            .drawer-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 0.25rem;
            }

            .drawer-title {
                font-size: 1rem;
                font-weight: 700;
                color: var(--md-sys-color-primary);
            }

            .drawer-scrim {
                position: fixed;
                inset: 0;
                z-index: 1210;
                background: rgba(28, 27, 31, 0.36);
            }

            body.drawer-open .drawer-scrim {
                display: block;
            }

            .search-box,
            .search-box input,
            .lang-selector {
                width: 100%;
            }

            .lang-selector {
                justify-content: space-between;
            }

            .lang-btn {
                flex: 1 1 0;
                text-align: center;
            }

            .app-container {
                flex-direction: column;
            }

            .timeline-sidebar {
                width: 100%;
                height: auto;
                max-height: none;
                position: relative;
                top: 0;
                padding: 0.85rem 1rem 0.65rem;
                border-right: none;
                border-bottom: 1px solid var(--md-sys-color-surface-variant);
                overflow: hidden;
            }

            .timeline-tree {
                display: flex;
                gap: 0.85rem;
                padding-left: 3.2rem;
                overflow-x: auto;
                padding-bottom: 0.3rem;
                padding-right: 3.2rem;
                scroll-snap-type: x proximity;
                scrollbar-width: none;
            }

            .timeline-tree::-webkit-scrollbar {
                display: none;
            }

            .timeline-scroll-hint {
                display: inline-flex;
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                width: 34px;
                height: 72px;
                align-items: center;
                justify-content: center;
                border: none;
                background: linear-gradient(90deg, rgba(253, 248, 248, 0), rgba(253, 248, 248, 0.98) 42%);
                color: var(--md-sys-color-primary);
                box-shadow: none;
                z-index: 5;
                cursor: pointer;
            }

            .timeline-scroll-hint--right {
                right: 0.1rem;
                border-radius: 18px 0 0 18px;
            }

            .timeline-scroll-hint--left {
                left: 0.1rem;
                border-radius: 0 18px 18px 0;
                background: linear-gradient(270deg, rgba(253, 248, 248, 0), rgba(253, 248, 248, 0.98) 42%);
            }

            .timeline-scroll-hint.hidden {
                opacity: 0;
                pointer-events: none;
            }

            .timeline-node {
                min-width: 170px;
                margin-bottom: 0;
                scroll-snap-align: start;
            }

            .timeline-node::before {
                display: none;
            }

            .content-area {
                padding: 1.25rem;
            }

            .event-card {
                padding: 1.35rem;
                border-radius: 22px;
            }

            .card-header {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                align-items: start;
                gap: 0.8rem;
            }

            .card-header-main {
                min-width: 0;
            }

            .card-header-main h2 {
                font-size: 1.2rem;
                line-height: 1.2;
                margin-bottom: 0.35rem;
            }

            .card-header-main .subtitle {
                font-size: 0.86rem;
                line-height: 1.3;
            }

            .mag-badge {
                align-self: start;
                font-size: 1rem;
                min-width: 76px;
                padding: 0.45rem 0.65rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .timeline-table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }

        @media (max-width: 640px) {
            header {
                padding: 0.65rem 0.8rem;
                gap: 0.65rem;
            }

            .menu-btn,
            .drawer-close {
                width: 40px;
                height: 40px;
            }

            .header-title-box h1 {
                font-size: 0.95rem;
            }

            .controls {
                width: min(88vw, 320px);
                padding: 0.95rem 0.9rem 1.1rem;
            }

            .timeline-sidebar {
                padding: 0.8rem 0.8rem 0.65rem;
            }

            .timeline-node {
                min-width: 150px;
                padding: 0.75rem 0.85rem;
            }

            .timeline-scroll-hint {
                width: 30px;
                height: 64px;
            }

            .content-area {
                padding: 0.9rem;
            }

            .event-card {
                padding: 1rem;
                border-radius: 18px;
                margin-bottom: 1rem;
            }

            .card-header {
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 0.65rem;
            }

            .card-header-main h2 {
                font-size: 1.05rem;
            }

            .card-header-main .subtitle {
                font-size: 0.8rem;
            }

            .mag-badge {
                min-width: 68px;
                font-size: 0.95rem;
                padding: 0.4rem 0.55rem;
            }

            .stats-grid,
            .mini-grid {
                grid-template-columns: 1fr;
            }

            .stat-card {
                padding: 0.9rem;
                gap: 0.75rem;
            }

            .event-map {
                height: 280px;
            }

            .stat-info .value {
                font-size: 1rem;
            }

            .description-box,
            .mini-card {
                padding: 0.95rem;
            }

            .section-title {
                font-size: 1rem;
            }

            .source-list {
                margin-left: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" type="button" aria-label="Open menu" onclick="toggleMobileDrawer(true)">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <div class="header-title-box">
            <h1><span class="material-symbols-outlined">analytics</span> <span id="ui-title">Sismos Históricos de Colombia</span></h1>
            <p id="ui-subtitle">Plataforma Informativa e Histórica de Amenaza Sísmica</p>
        </div>
        <div class="controls" id="mobileDrawer">
            <div class="drawer-header">
                <span class="drawer-title">Menu</span>
                <button class="drawer-close" type="button" aria-label="Close menu" onclick="toggleMobileDrawer(false)">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="search-box">
                <span class="material-symbols-outlined">search</span>
                <input type="text" id="searchInput" placeholder="Buscar / Search..." onkeyup="filterEvents()">
            </div>
            <div class="lang-selector">
                <button class="lang-btn active" onclick="setLanguage('es'); toggleMobileDrawer(false)">ES</button>
                <button class="lang-btn" onclick="setLanguage('en'); toggleMobileDrawer(false)">EN</button>
                <button class="lang-btn" onclick="setLanguage('de'); toggleMobileDrawer(false)">DE</button>
            </div>
        </div>
    </header>
    <button class="drawer-scrim" id="drawerScrim" type="button" aria-label="Close menu" onclick="toggleMobileDrawer(false)"></button>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="timeline-sidebar">
            <div class="timeline-sidebar-inner">
                <div class="timeline-tree" id="timelineNodes">
                    <!-- Dynamic Nodes Inserted via JS -->
                </div>
                <button class="timeline-scroll-hint timeline-scroll-hint--left hidden" id="timelineScrollHintLeft" type="button" aria-label="Scroll earthquake list to the left" onclick="scrollTimelineLeft()">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <button class="timeline-scroll-hint timeline-scroll-hint--right hidden" id="timelineScrollHint" type="button" aria-label="Scroll earthquake list to the right" onclick="scrollTimelineRight()">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>
            </div>
        </nav>

        <!-- Main Display Content Area -->
        <main class="content-area">
            <div id="eventDetailDisplay">
                <!-- Active Event Card Injected via JS -->
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        const sources = {

        let currentLang = 'es';
        let activeIndex = 0;

        function toggleMobileDrawer(forceState) {
            const shouldOpen = typeof forceState === 'boolean'
                ? forceState
                : !document.body.classList.contains('drawer-open');
            document.body.classList.toggle('drawer-open', shouldOpen);
        }

        function updateTimelineScrollHint() {
            const container = document.getElementById('timelineNodes');
            const rightHint = document.getElementById('timelineScrollHint');
            const leftHint = document.getElementById('timelineScrollHintLeft');
            if (!container || !rightHint || !leftHint || window.innerWidth > 900) {
                rightHint?.classList.add('hidden');
                leftHint?.classList.add('hidden');
                return;
            }

            const hasOverflow = container.scrollWidth > container.clientWidth + 8;
            const atLeftEdge = container.scrollLeft <= 8;
            const atRightEdge = container.scrollLeft + container.clientWidth >= container.scrollWidth - 8;
            rightHint.classList.toggle('hidden', !hasOverflow || atRightEdge);
            leftHint.classList.toggle('hidden', !hasOverflow || atLeftEdge);
        }

        function scrollTimelineLeft() {
            const container = document.getElementById('timelineNodes');
            if (!container) return;
            container.scrollBy({ left: -220, behavior: 'smooth' });
            window.setTimeout(updateTimelineScrollHint, 280);
        }

        function scrollTimelineRight() {
            const container = document.getElementById('timelineNodes');
            if (!container) return;
            container.scrollBy({ left: 220, behavior: 'smooth' });
            window.setTimeout(updateTimelineScrollHint, 280);
        }

        function getSeverityColor(mag) {
            if (mag >= 8.0) return 'var(--severity-extreme)';
            if (mag >= 7.0) return 'var(--severity-high)';
            if (mag >= 6.0) return 'var(--severity-moderate)';
            return 'var(--severity-low)';
        }

        function renderSourceLinks(ids) {
            return ids.map(id => {
                const source = sources[id];
                return `<li><a class="source-link" href="${source.url}" target="_blank" rel="noopener noreferrer">[${id}] ${source.title}</a></li>`;
            }).join('');
        }

        function createStarIcon() {
            return L.divIcon({
                className: 'event-star-marker',
                html: '★',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
        }

        function renderEventMap(eq) {
            const mapContainer = document.getElementById('eventMap');
            if (!mapContainer || typeof L === 'undefined') return;

            if (eventMap) {
                eventMap.remove();
                eventMap = null;
            }

            const [lat, lon] = eq.coordinates.split(',').map(value => parseFloat(value.trim()));

            eventMap = L.map(mapContainer, {
                zoomControl: true,
                attributionControl: true
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
                subdomains: 'abcd',
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
            }).addTo(eventMap);

            const borderLayer = L.geoJSON(colombiaBorderGeoJson, {
                style: {
                    color: '#8b0000',
                    weight: 2,
                    opacity: 0.95,
                    fillColor: '#8b0000',
                    fillOpacity: 0.05
                }
            }).addTo(eventMap);

            eventMap.fitBounds(borderLayer.getBounds().pad(0.08));

            eventMarker = L.marker([lat, lon], {
                icon: createStarIcon(),
                title: eq.title[currentLang]
            }).addTo(eventMap);

            eventMarker.bindPopup(`<strong>${eq.title[currentLang]}</strong><br>${eq.location[currentLang]}<br>${eq.coordinates}`);
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === lang);
            });

            const ui = reportContent[lang];
            document.getElementById('ui-title').innerText = ui.title;
            document.getElementById('ui-subtitle').innerText = ui.subtitle;
            document.getElementById('searchInput').placeholder = ui.searchPlaceholder;

            renderTimeline(document.getElementById('searchInput').value.toLowerCase());
            renderEventDetail(activeIndex);
            updateTimelineScrollHint();
        }

        function renderTimeline(filterText = '') {
            const container = document.getElementById('timelineNodes');
            container.innerHTML = '';

            eqData.forEach((eq, index) => {
                const title = eq.title[currentLang];
                const loc = eq.location[currentLang];
                const query = filterText.trim();

                if (query && !title.toLowerCase().includes(query) && !loc.toLowerCase().includes(query) && !eq.year.includes(query)) {
                    return;
                }

                const node = document.createElement('div');
                node.className = `timeline-node ${index === activeIndex ? 'active' : ''}`;
                node.onclick = () => {
                    activeIndex = index;
                    renderTimeline(query);
                    renderEventDetail(activeIndex);
                    toggleMobileDrawer(false);
                };

                const badgeColor = getSeverityColor(eq.magnitude);
                node.innerHTML = `
                    <div class="node-year">${eq.year}</div>
                    <div class="node-title">${title}</div>
                    <span class="node-mag" style="background:${badgeColor}">M ${eq.magnitude}</span>
                `;
                container.appendChild(node);
            });

            window.requestAnimationFrame(updateTimelineScrollHint);
        }

            display.innerHTML = `
                <div class="event-card">
                    <div class="card-header">
                        <div class="card-header-main">
                            <h2>${eq.title[currentLang]}</h2>

                            </div>
                        </div>

                            ${eq.magnitude}

                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon"><span class="material-symbols-outlined">calendar_today</span></div>

                                <div class="value">${eq.date}</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><span class="material-symbols-outlined">my_location</span></div>
                            <div class="stat-info">
                                <div class="label">${ui.coordinates}</div>
                                <div class="value">${eq.coordinates}</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><span class="material-symbols-outlined">straighten</span></div>
                            <div class="stat-info">
                                <div class="label">${ui.depth}</div>
                                <div class="value">${eq.depth}</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><span class="material-symbols-outlined">group_off</span></div>
                            <div class="stat-info">
                                <div class="label">${ui.deaths}</div>
                                <div class="value" style="color:var(--severity-extreme)">${deathsValue}</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><span class="material-symbols-outlined">personal_injury</span></div>
                            <div class="stat-info">
                                <div class="label">${ui.injured}</div>
                                <div class="value">${eq.injured[currentLang]}</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><span class="material-symbols-outlined">waves</span></div>
                            <div class="stat-info">
                                <div class="label">${ui.intensity}</div>
                                <div class="value">${mmiValue}</div>
                            </div>
                        </div>
                    </div>

                    <div class="event-map-shell">
                        <div id="eventMap" class="event-map" aria-label="Earthquake map"></div>
                    </div>

                    <div class="section-stack">
                        <div>
                            <div class="section-title">
                                <span class="material-symbols-outlined">info</span>
                                ${ui.impactHeader}
                            </div>
                            <div class="description-box">${eq.impact[currentLang]}</div>
                        </div>

                        <div class="mini-card">
                            <h3>${ui.eventSources}</h3>
                            <ol class="source-list">${renderSourceLinks(eq.sources)}</ol>
                        </div>
                    </div>

                    <div class="tag-container">
                        <span class="tag"><b>${ui.fault}:</b> ${eq.fault[currentLang]}</span>
                        <span class="tag">MMI ${mmiValue}</span>
                        <span class="tag">Mw ${eq.magnitude}</span>
                    </div>
                </div>
            `;

            renderEventMap(eq);
        }

        function filterEvents() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderTimeline(query);
        }

        window.onload = () => {
            setLanguage('es');

            const timelineNodes = document.getElementById('timelineNodes');
            timelineNodes?.addEventListener('scroll', updateTimelineScrollHint, { passive: true });
            window.addEventListener('resize', updateTimelineScrollHint);
        };
    </script>
